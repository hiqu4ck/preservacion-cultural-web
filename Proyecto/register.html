<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta en K'ajóol Lu'um</title>
    <link rel="stylesheet" href="src/CSS/register.css">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="top-bar">
        <div class="logo-wrapper">
            <img src="img/logo.png" alt="Logo K’ajóol Lu’um" class="logo-img">
            <span class="logo-text">K’ajóol Lu’um</span>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container">

        <!-- LADO IZQUIERDO (IMAGEN) -->
        <div class="left-panel">
            <img src="img/3.jpeg" alt="Fondo naturaleza" class="bg-image">
            <h1>¡Te damos la bienvenida!</h1>
        </div>

        <!-- LADO DERECHO (FORMULARIO) -->
        <div class="right-panel">
            <div class="form-container">
                <h2>Crear cuenta en K'ajóol Lu'um</h2>

                <form>
                    <div class="input-group">
                        <select>
                            <option>México (+52)</option>
                            <option>Estados Unidos (+1)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <input type="text" placeholder="Usuario">
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Contraseña">
                    </div>

                    <button class="btn-continue">Continuar</button>
                </form>

                <p class="login-link">
                    ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
                </p>

                <div class="social-login">
                    <button>Continuar con Google</button>
                    <button>Continuar con Apple</button>
                    <button>Continuar con correo electrónico</button>
                    <button>Continuar con Facebook</button>
                </div>

                <a href="index.html" class="back-link">Volver</a>
            </div>
        </div>

    </div>

</body>
</html>
