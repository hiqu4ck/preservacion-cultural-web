<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña -->
    <title>Crear cuenta en K'ajóol Lu'um</title>

    <!-- Archivo CSS con los estilos visuales -->
    <link rel="stylesheet" href="src/CSS/register.css">
</head>

<body>

    <!-- ================================================== -->
    <!--                   BARRA SUPERIOR                    -->
    <!-- ================================================== -->
    <header class="top-bar">

        <!-- Contenedor del logo y el nombre -->
        <div class="logo-wrapper">

            <!-- Imagen del logo -->
            <img src="img/logo.png" alt="Logo K’ajóol Lu’um" class="logo-img">

            <!-- Nombre del proyecto -->
            <span class="logo-text">K’ajóol Lu’um</span>
        </div>
    </header>

    <!-- ================================================== -->
    <!--                CONTENEDOR PRINCIPAL                 -->
    <!-- ================================================== -->
    <div class="main-container">

        <!-- ================== LADO IZQUIERDO ================== -->
        <!-- Aquí va una imagen tipo banner con un título -->
        <div class="left-panel">

            <!-- Imagen de fondo -->
            <img src="img/3.jpeg" alt="Fondo naturaleza" class="bg-image">

            <!-- Texto encima de la imagen -->
            <h1>¡Te damos la bienvenida!</h1>
        </div>

        <!-- ================== LADO DERECHO (FORMULARIO) ================== -->
        <div class="right-panel">

            <!-- Caja donde está el formulario -->
            <div class="form-container">

                <!-- Título principal -->
                <h2>Crear cuenta en K'ajóol Lu'um</h2>

                <!-- FORMULARIO DE REGISTRO -->
                <!-- ⚠️ Si lo conectas con JS debes agregar id="form-register" -->
                <form id="form-register">

                    <!-- Selección de país -->
                    <div class="input-group">
                        <select id="pais">
                            <option value="MX">México (+52)</option>
                            <option value="US">Estados Unidos (+1)</option>
                        </select>
                    </div>

                    <!-- Usuario / teléfono -->
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="telefono"
                            placeholder="Usuario o número telefónico">
                    </div>

                    <!-- Contraseña -->
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Contraseña">
                    </div>

                    <!-- Botón principal -->
                    <button class="btn-continue" type="submit">
                        Continuar
                    </button>
                </form>

                <!-- Enlace para ir al login -->
                <p class="login-link">
                    ¿Ya tienes cuenta? 
                    <a href="login.html">Iniciar sesión</a>
                </p>

                <!-- Botones de inicio de sesión alternativos -->
                <div class="social-login">
                    <button>Continuar con Google</button>
                    <button>Continuar con Apple</button>
                    <button>Continuar con correo electrónico</button>
                    <button>Continuar con Facebook</button>
                </div>

                <!-- Enlace inferior para regresar a inicio -->
                <a href="index.html" class="back-link">Volver</a>

            </div>
        </div>

    </div>

</body>
</html>
